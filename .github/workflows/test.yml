name: Test

on:
  push:
  pull_request:

jobs:

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      - name: Install JS tooling
        run: npm install --ignore-scripts

      - name: Install PHP tooling
        run: composer install

      - name: Start the environment
        run: npm run start

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  # Sanity check: the release packaging must work from the repo root and
  # produce a plugin ZIP. Unsigned and without the embedded manifest on
  # purpose: this runs on every push to any branch, and the release ZIP
  # with embedded checksums is only built in deploy.yml.
  zip:
    name: Zip
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # wp-release requires Node.js >=22.12; the repo-wide .nvmrc still pins
      # Node 20 for the wp-env development environment.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      # --ignore-scripts skips the "preinstall" composer script; packaging
      # needs only the Node tooling.
      - name: Install NPM dependencies
        run: npm ci --ignore-scripts

      - name: Zip
        run: npm run zip -- --no-embed-checksums --no-sign-checksums

  # A pull request that changed the plugin needs a changeset, either with
  # a release note or an empty one for an explicit no-release decision.
  changeset:
    name: Check the changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The comparison needs the base branch history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci --ignore-scripts

      - name: Changeset status
        run: npx wp-release changeset-status --since "origin/${{ github.base_ref }}"
