name: Deploy

# Release publishes deploy the released ZIP to tags/<version> on
# WordPress.org. Master pushes update the WordPress.org readme only: trunk
# is no longer kept in sync from master and advances only through manual
# SVN commits.
on:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write

jobs:

  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-24.04
    concurrency:
      group: wporg-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # wp-release requires Node.js >=22.12; the repo-wide .nvmrc still pins
      # Node 20 for the wp-env development environment.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      # GitHub's Ubuntu runners don't include the svn client that
      # wp-release needs to deploy.
      - name: Install Subversion
        run: |
          if command -v svn >/dev/null 2>&1; then
            echo "Subversion is already installed."
          else
            sudo apt-get update --quiet
            sudo apt-get install --yes --quiet --no-install-recommends subversion
          fi

      # --ignore-scripts skips the "preinstall" composer script; packaging
      # and deployment need only the Node tooling and the svn client.
      - name: Install NPM dependencies
        run: npm ci --ignore-scripts

      # Archives the repo (selection driven by .distignore) with the
      # checksums manifest (checksums.json, WordPress.org
      # plugin-checksums format) embedded at the package root of the ZIP, so
      # the wp.org build and the release ZIP both ship it. The manifest name
      # and embedding come from the integrity settings of
      # wp-release.config.mjs. The manifest is unsigned for now: signing is
      # deferred until a signing key is provisioned.
      - name: Package the release with embedded checksums
        if: github.event_name == 'release'
        run: npm run zip

      # Attach the release ZIP (and its draft-source counterpoint) to the
      # GitHub release, pre-releases included.
      - name: Attach release artifacts
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" minit.*.zip --clobber

      # Stable releases and pre-releases: build tags/<version> on
      # WordPress.org exactly from the files of the release ZIP. Trunk is
      # left alone: the development copy on wp.org is not kept in sync from
      # master. There is no assets/ directory in the repository, so
      # --assets-dir is not set and plugin assets are only uploaded manually
      # for now.
      - name: Deploy the release tag to WordPress.org
        if: github.event_name == 'release'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: npx wp-release deploy-svn --from-zip minit.*.zip --slug minit --svn-tag "${GITHUB_REF_NAME#v}"

      # Master pushes: update the wp.org readme without tagging.
      - name: Update the WordPress.org readme
        if: github.event_name == 'push'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: npx wp-release deploy-svn . --slug minit --readme-only
